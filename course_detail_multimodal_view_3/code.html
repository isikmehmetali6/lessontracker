<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Study Tracker Signup Screen</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#3ce619",
                "background-light": "#f6f8f6",
                "background-dark": "#142111",
                "sage": {
                    50: '#f4f7f4',
                    100: '#e3ebe3',
                    300: '#a3b8a0',
                    500: '#698863', // Sage green for text/buttons
                    600: '#557050',
                    800: '#2d3b2a',
                },
                "cream": "#fdfdfc",
              },
              fontFamily: {
                "display": ["Lexend", "sans-serif"]
              },
              borderRadius: {
                  "DEFAULT": "1rem", // 16px as requested
                  "lg": "2rem", 
                  "xl": "3rem", 
                  "full": "9999px"
              },
              boxShadow: {
                  "soft": "0 8px 24px -6px rgba(0, 0, 0, 0.04)",
                  "glass": "0 8px 32px 0 rgba(31, 38, 135, 0.07)",
                  "input": "0 2px 12px -2px rgba(0, 0, 0, 0.03)",
              }
            },
          },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-white/80 dark:bg-[#142111]/80 backdrop-blur-xl border border-white/40 dark:border-white/5;
            }
        }
        body {
            font-family: 'Lexend', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-100 min-h-screen relative overflow-hidden flex flex-col">
<div class="fixed -top-32 -right-32 w-96 h-96 bg-sage-100 dark:bg-sage-800/30 rounded-full blur-3xl opacity-60 pointer-events-none"></div>
<div class="fixed top-1/2 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed -bottom-20 right-0 w-80 h-80 bg-sage-100 dark:bg-sage-800/20 rounded-full blur-3xl opacity-40 pointer-events-none"></div>
<header class="flex items-center justify-between px-6 pt-12 pb-4 z-10">
<button class="flex items-center justify-center w-12 h-12 bg-white dark:bg-white/5 rounded shadow-soft hover:shadow-md transition-shadow group border border-transparent hover:border-sage-100 dark:hover:border-white/10">
<span class="material-symbols-outlined text-slate-600 dark:text-white group-hover:text-sage-500 transition-colors">arrow_back</span>
</button>
</header>
<main class="flex-1 flex flex-col px-8 z-10 pt-4 pb-8 overflow-y-auto">
<div class="mb-10 animate-fade-in-up">
<h1 class="text-3xl font-bold text-slate-900 dark:text-white leading-tight mb-2 tracking-tight">Create<br/>Account</h1>
<p class="text-sage-500 dark:text-sage-300 text-base font-normal">Start your productive journey today</p>
</div>
<form class="flex flex-col gap-5 w-full">
<div class="group">
<label class="sr-only" for="fullname">Full Name</label>
<div class="relative transition-all duration-300 focus-within:-translate-y-1">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-sage-500 transition-colors">person</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-white dark:bg-white/5 border-0 ring-1 ring-black/5 dark:ring-white/10 rounded text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-sage-500 focus:bg-white dark:focus:bg-white/10 shadow-input transition-all outline-none" id="fullname" placeholder="Full Name" type="text"/>
</div>
</div>
<div class="group">
<label class="sr-only" for="email">Email Address</label>
<div class="relative transition-all duration-300 focus-within:-translate-y-1">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-sage-500 transition-colors">mail</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-white dark:bg-white/5 border-0 ring-1 ring-black/5 dark:ring-white/10 rounded text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-sage-500 focus:bg-white dark:focus:bg-white/10 shadow-input transition-all outline-none" id="email" placeholder="Email Address" type="email"/>
</div>
</div>
<div class="group">
<label class="sr-only" for="password">Password</label>
<div class="relative transition-all duration-300 focus-within:-translate-y-1">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-sage-500 transition-colors">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-white dark:bg-white/5 border-0 ring-1 ring-black/5 dark:ring-white/10 rounded text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-sage-500 focus:bg-white dark:focus:bg-white/10 shadow-input transition-all outline-none" id="password" placeholder="Password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-start gap-3 mt-1 px-1">
<div class="flex h-6 items-center">
<input class="h-5 w-5 rounded border-gray-300 text-sage-500 focus:ring-sage-500 dark:border-white/10 dark:bg-white/5 dark:checked:bg-sage-500 cursor-pointer" id="terms" name="terms" type="checkbox"/>
</div>
<div class="text-sm leading-6">
<label class="font-medium text-slate-500 dark:text-slate-400" for="terms">
                        I agree to the <a class="font-semibold text-sage-500 hover:text-sage-600 transition-colors" href="#">Terms of Service</a> and <a class="font-semibold text-sage-500 hover:text-sage-600 transition-colors" href="#">Privacy Policy</a>
</label>
</div>
</div>
<button class="mt-6 w-full bg-sage-500 hover:bg-sage-600 text-white font-bold py-4 px-4 rounded shadow-lg shadow-sage-500/20 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group" type="button">
<span>Create Account</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</main>
<div class="px-6 pb-10 pt-4 z-10 text-center">
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium">
            Already have an account? 
            <a class="text-sage-500 dark:text-sage-300 font-bold hover:underline hover:text-sage-600 ml-1 transition-colors" href="#">Log In</a>
</p>
</div>

</body></html>
