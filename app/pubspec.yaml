name: lesson_tracker
description: "A multimodal lesson tracking app with OCR, voice notes, and smart organization"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  
  # State Management
  provider: ^6.1.2
  
  # Database
  sqflite_sqlcipher: ^3.1.0+1
  sqflite_common_ffi_web: ^0.4.5+2
  path_provider: ^2.1.4
  path: ^1.9.0
  
  # OCR (Google ML Kit) - Apple Silicon simulator uyumsuz, fiziksel cihazda aç
  # google_mlkit_text_recognition: ^0.14.0
  
  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  
  # Audio Recording
  record: ^6.0.0
  audioplayers: ^6.6.0
  
  # File Management
  uuid: ^4.5.1
  intl: ^0.20.2
  
  # Animations
  animations: ^2.0.11
  fl_chart: ^1.1.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  file_picker: ^10.3.8
  open_filex: ^4.7.0
  add_2_calendar: ^3.0.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  home_widget: ^0.9.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  cloud_functions: ^6.0.7
  http: ^1.6.0
  shared_preferences: ^2.5.4
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  flutter_secure_storage: ^10.0.0
  encrypt: ^5.0.3
  cached_network_image: ^3.4.1
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.3.1
  table_calendar: ^3.2.0
  blur: ^4.0.2
  workmanager: ^0.9.0+3
  flutter_image_compress: ^2.3.0
  crypto: ^3.0.6
  
  # PDF Viewing & Annotation
  pdfx: ^2.9.0
  
  # Drawing / Handwriting
  perfect_freehand: ^2.3.0
  firebase_crashlytics: ^5.2.6



dependency_overrides:
  sqlite3: 2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  sqflite_common_ffi: ^2.4.0+2
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1
  integration_test:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_logo.png"
  color_dark: "#1A1A1A"
  image_dark: "assets/images/splash_logo_dark.png"
  android_12:
    image: "assets/images/splash_logo.png"
    icon_background_color: "#FFFFFF"
    image_dark: "assets/images/splash_logo_dark.png"
    icon_background_color_dark: "#1A1A1A"

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
    - .env

  fonts:
    - family: Lexend
      fonts:
        - asset: fonts/Lexend-Light.ttf
          weight: 300
        - asset: fonts/Lexend-Regular.ttf
          weight: 400
        - asset: fonts/Lexend-Medium.ttf
          weight: 500
        - asset: fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: fonts/Lexend-Bold.ttf
          weight: 700
