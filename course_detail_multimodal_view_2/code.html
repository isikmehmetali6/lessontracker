<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Study Tracker Login Screen</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#3ce619",
                "background-light": "#f6f8f6",
                "background-dark": "#142111",
                "sage": {
                    50: '#f4f7f4',
                    100: '#e3ebe3',
                    500: '#698863', // Sage green for text/buttons
                    600: '#577353', // Slightly darker for hover
                    800: '#2d3b2a',
                },
                "cream": "#fdfdfc",
              },
              fontFamily: {
                "display": ["Lexend", "sans-serif"]
              },
              borderRadius: {
                  "DEFAULT": "1rem", // 16px
                  "lg": "2rem", 
                  "xl": "3rem", 
                  "full": "9999px"
              },
              boxShadow: {
                  "soft": "0 8px 24px -6px rgba(0, 0, 0, 0.04)",
                  "glass": "0 8px 32px 0 rgba(31, 38, 135, 0.07)",
                  "glow": "0 10px 30px -10px rgba(105, 136, 99, 0.4)",
              }
            },
          },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-white/80 dark:bg-[#142111]/80 backdrop-blur-xl border border-white/40 dark:border-white/5;
            }
        }
        body {
            font-family: 'Lexend', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-cream text-slate-800 min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-sage-50 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 -z-10 opacity-70"></div>
<div class="absolute bottom-0 left-0 w-[300px] h-[300px] bg-sage-100 rounded-full blur-3xl translate-y-1/3 -translate-x-1/3 -z-10 opacity-50"></div>
<main class="w-full max-w-[340px] z-10 flex flex-col">
<div class="mb-10 text-left">
<h1 class="text-4xl font-bold text-slate-900 mb-2 tracking-tight">Welcome<br/>Back!</h1>
<p class="text-slate-400 text-lg font-light">Let's continue your learning journey.</p>
</div>
<form class="flex flex-col gap-5">
<div class="group">
<div class="relative transition-all duration-300">
<input class="w-full h-16 bg-white border-none text-slate-700 placeholder:text-slate-400 text-base px-6 rounded shadow-soft focus:ring-2 focus:ring-sage-500/20 focus:shadow-lg transition-all outline-none" placeholder="Email Address" type="email"/>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-sage-500 transition-colors">mail</span>
</div>
</div>
<div class="group">
<div class="relative transition-all duration-300">
<input class="w-full h-16 bg-white border-none text-slate-700 placeholder:text-slate-400 text-base px-6 rounded shadow-soft focus:ring-2 focus:ring-sage-500/20 focus:shadow-lg transition-all outline-none" placeholder="Password" type="password"/>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-sage-500 transition-colors">lock</span>
</div>
</div>
<div class="flex justify-end">
<a class="text-sage-500 text-sm font-medium hover:text-sage-600 transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full h-16 bg-sage-500 text-white text-lg font-medium rounded shadow-glow hover:bg-sage-600 active:scale-[0.98] transition-all duration-200 mt-2" type="button">
                Sign In
            </button>
</form>
<div class="mt-12 mb-4">
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-slate-200"></div>
<span class="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase tracking-wide">Or continue with</span>
<div class="flex-grow border-t border-slate-200"></div>
</div>
</div>
<div class="flex gap-4">
<button class="flex-1 h-14 bg-white rounded shadow-soft flex items-center justify-center hover:bg-gray-50 transition-colors border border-transparent hover:border-gray-100 group">
<svg class="w-6 h-6 group-hover:scale-110 transition-transform duration-200" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="flex-1 h-14 bg-white rounded shadow-soft flex items-center justify-center hover:bg-gray-50 transition-colors border border-transparent hover:border-gray-100 group">
<svg class="w-6 h-6 text-black group-hover:scale-110 transition-transform duration-200" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24.02-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.78.79.05 1.97-.67 3.28-.59 1.1.08 2.39.45 2.96 1.48-2.66 1.38-2.16 4.9.47 5.96-.39 1.48-1.22 3.12-1.79 3.9v.01l-.03.04.01-.01zm-3.85-15.5c.67-1.16 1.74-1.8 2.86-1.78.34 1.47-1.08 3.11-2.5 3.11-.22 0-.48-.02-.67-.06-.11-1.12.35-2.31 1.05-3.01l-.74 1.74z"></path>
</svg>
</button>
</div>
<p class="text-center mt-12 text-slate-400 text-sm">
            Don't have an account? <a class="text-sage-500 font-medium hover:text-sage-600 transition-colors" href="#">Sign Up</a>
</p>
</main>

</body></html>
