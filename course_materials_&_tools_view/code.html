<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Course Materials &amp; Tools View</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5de619",
                        "background-light": "#f6f8f6",
                        "background-dark": "#162111",
                        "sage-text": "#4b6342", 
                        "sage-bg": "#e6ebe4"
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-panel {
            background: rgba(22, 33, 17, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-black">
<div class="relative min-h-screen w-full flex flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-2xl overflow-hidden pb-24">
<!-- Header -->
<header class="sticky top-0 z-40 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm p-4 pb-2 transition-colors duration-300">
<div class="flex items-center justify-between mb-4">
<button class="flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/5 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/5 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined text-[24px]">search</span>
</button>
<button class="flex items-center justify-center p-2 -mr-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/5 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</div>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight">
                Advanced<br/>Macroeconomics
            </h1>
</header>
<!-- Filter Chips -->
<div class="px-4 pb-2 sticky top-[120px] z-30 bg-background-light dark:bg-background-dark">
<div class="flex gap-3 overflow-x-auto no-scrollbar py-2">
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary px-5 shadow-sm shadow-primary/20 transition-transform active:scale-95">
<span class="text-black text-sm font-semibold">All</span>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-white dark:bg-white/5 border border-transparent dark:border-white/10 px-5 transition-colors hover:bg-sage-bg dark:hover:bg-white/10">
<span class="text-slate-600 dark:text-gray-300 text-sm font-medium">Notes</span>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-white dark:bg-white/5 border border-transparent dark:border-white/10 px-5 transition-colors hover:bg-sage-bg dark:hover:bg-white/10">
<span class="text-slate-600 dark:text-gray-300 text-sm font-medium">Audio</span>
</button>
<button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-white dark:bg-white/5 border border-transparent dark:border-white/10 px-5 transition-colors hover:bg-sage-bg dark:hover:bg-white/10">
<span class="text-slate-600 dark:text-gray-300 text-sm font-medium">Scans</span>
</button>
</div>
</div>
<!-- Scrollable Feed -->
<main class="flex-1 flex flex-col px-4 pt-2 gap-6">
<!-- Section: Today -->
<section>
<h4 class="text-sage-text dark:text-primary/80 text-xs font-bold uppercase tracking-wider mb-3 ml-1">Today</h4>
<div class="flex flex-col gap-3">
<!-- Card 1: Audio -->
<article class="group relative flex items-center gap-4 bg-white dark:bg-white/5 p-4 rounded-xl shadow-sm border border-transparent hover:border-primary/30 transition-all duration-300 hover:shadow-md">
<div class="flex items-center justify-center rounded-lg bg-primary/20 text-primary-dark shrink-0 size-12 group-hover:bg-primary group-hover:text-black transition-colors">
<span class="material-symbols-outlined text-[24px]">mic</span>
</div>
<div class="flex flex-col flex-1 min-w-0">
<h3 class="text-slate-900 dark:text-white text-base font-semibold leading-snug line-clamp-1">Lecture 4: Inflation Models</h3>
<div class="flex items-center gap-2 mt-1">
<span class="text-slate-500 dark:text-gray-400 text-xs font-medium">45:00 min</span>
<span class="size-1 rounded-full bg-gray-300 dark:bg-gray-600"></span>
<span class="text-primary dark:text-primary/90 text-xs font-medium">Audio Recording</span>
</div>
</div>
<button class="shrink-0 text-gray-400 hover:text-slate-900 dark:hover:text-white transition-colors p-2">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</article>
<!-- Card 2: Note -->
<article class="group relative flex items-center gap-4 bg-white dark:bg-white/5 p-4 rounded-xl shadow-sm border border-transparent hover:border-primary/30 transition-all duration-300 hover:shadow-md">
<div class="flex items-center justify-center rounded-lg bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-400 shrink-0 size-12 group-hover:bg-indigo-100 dark:group-hover:bg-indigo-900/40 transition-colors">
<span class="material-symbols-outlined text-[24px]">description</span>
</div>
<div class="flex flex-col flex-1 min-w-0">
<h3 class="text-slate-900 dark:text-white text-base font-semibold leading-snug line-clamp-1">Chapter 4 Summary</h3>
<div class="flex items-center gap-2 mt-1">
<span class="text-slate-500 dark:text-gray-400 text-xs font-medium">250 words</span>
<span class="size-1 rounded-full bg-gray-300 dark:bg-gray-600"></span>
<span class="text-indigo-600 dark:text-indigo-400 text-xs font-medium">Text Note</span>
</div>
</div>
<button class="shrink-0 text-gray-400 hover:text-slate-900 dark:hover:text-white transition-colors p-2">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</article>
</div>
</section>
<!-- Section: Yesterday -->
<section>
<h4 class="text-sage-text dark:text-primary/80 text-xs font-bold uppercase tracking-wider mb-3 ml-1">Yesterday</h4>
<div class="flex flex-col gap-3">
<!-- Card 3: Scan -->
<article class="group relative flex items-center gap-4 bg-white dark:bg-white/5 p-4 rounded-xl shadow-sm border border-transparent hover:border-primary/30 transition-all duration-300 hover:shadow-md">
<div class="flex items-center justify-center rounded-lg bg-orange-50 dark:bg-orange-900/20 text-orange-600 dark:text-orange-400 shrink-0 size-12 group-hover:bg-orange-100 dark:group-hover:bg-orange-900/40 transition-colors">
<span class="material-symbols-outlined text-[24px]">photo_camera</span>
</div>
<div class="flex flex-col flex-1 min-w-0">
<h3 class="text-slate-900 dark:text-white text-base font-semibold leading-snug line-clamp-1">Whiteboard Snapshot</h3>
<div class="flex items-center gap-2 mt-1">
<span class="text-slate-500 dark:text-gray-400 text-xs font-medium">JPG</span>
<span class="size-1 rounded-full bg-gray-300 dark:bg-gray-600"></span>
<span class="text-orange-600 dark:text-orange-400 text-xs font-medium">Scan</span>
</div>
</div>
<!-- Thumbnail Preview for Image -->
<div class="shrink-0 size-10 rounded overflow-hidden border border-gray-100 dark:border-white/10">
<div class="w-full h-full bg-gradient-to-br from-gray-200 to-gray-300 dark:from-gray-700 dark:to-gray-600" data-alt="Abstract gradient representing whiteboard thumbnail"></div>
</div>
</article>
<!-- Card 4: Audio (Older) -->
<article class="group relative flex items-center gap-4 bg-white dark:bg-white/5 p-4 rounded-xl shadow-sm border border-transparent hover:border-primary/30 transition-all duration-300 hover:shadow-md opacity-70 hover:opacity-100">
<div class="flex items-center justify-center rounded-lg bg-primary/10 text-primary-dark shrink-0 size-12 group-hover:bg-primary group-hover:text-black transition-colors">
<span class="material-symbols-outlined text-[24px]">mic</span>
</div>
<div class="flex flex-col flex-1 min-w-0">
<h3 class="text-slate-900 dark:text-white text-base font-semibold leading-snug line-clamp-1">Lecture 3: Key Concepts</h3>
<div class="flex items-center gap-2 mt-1">
<span class="text-slate-500 dark:text-gray-400 text-xs font-medium">52:10 min</span>
<span class="size-1 rounded-full bg-gray-300 dark:bg-gray-600"></span>
<span class="text-primary dark:text-primary/90 text-xs font-medium">Audio Recording</span>
</div>
</div>
<button class="shrink-0 text-gray-400 hover:text-slate-900 dark:hover:text-white transition-colors p-2">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</article>
</div>
</section>
<!-- Spacer for bottom bar -->
<div class="h-16"></div>
</main>
<!-- Glassmorphism Action Bar -->
<div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 w-[calc(100%-32px)] max-w-sm z-50">
<div class="glass-panel h-16 rounded-2xl flex items-center justify-between px-6 shadow-xl shadow-gray-200/50 dark:shadow-black/50">
<!-- OCR Tool -->
<button class="group flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-xl transition-all hover:bg-white/50 dark:hover:bg-white/10 active:scale-90">
<span class="material-symbols-outlined text-slate-700 dark:text-white text-[28px] group-hover:text-primary transition-colors">document_scanner</span>
</button>
<!-- Audio Tool -->
<button class="group flex flex-col items-center justify-center gap-1 w-14 h-14 rounded-full bg-primary shadow-lg shadow-primary/30 transition-all hover:-translate-y-1 hover:shadow-primary/50 active:scale-95 active:translate-y-0">
<span class="material-symbols-outlined text-black text-[30px]">mic</span>
</button>
<!-- Text Tool -->
<button class="group flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-xl transition-all hover:bg-white/50 dark:hover:bg-white/10 active:scale-90">
<span class="material-symbols-outlined text-slate-700 dark:text-white text-[28px] group-hover:text-primary transition-colors">edit_note</span>
</button>
<!-- Image Tool -->
<button class="group flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-xl transition-all hover:bg-white/50 dark:hover:bg-white/10 active:scale-90">
<span class="material-symbols-outlined text-slate-700 dark:text-white text-[28px] group-hover:text-primary transition-colors">photo_camera</span>
</button>
</div>
</div>
</div>
</body></html>
