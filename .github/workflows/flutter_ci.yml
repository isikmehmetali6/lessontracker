name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Verify env asset optional load
        working-directory: app
        run: |
          ! grep -qE "^\s*- \.env\s*$" pubspec.yaml \
            && grep -q "isOptional: true" lib/main.dart

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test --no-pub --reporter compact

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub